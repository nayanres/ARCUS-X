name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install the pinned runtime closure so CI is reproducible.
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements-lock.txt

      # The validation suite is self-contained (no pytest required).
      - name: Run validation suite
        run: python tests/test_arcus_hardening.py
