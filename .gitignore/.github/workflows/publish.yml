name: Publish container image

# Builds the reference evaluation image, verifies it by running the validation
# suite INSIDE the freshly built container, then publishes the image to GHCR
# with an SBOM and a keyless signature. The published, digest-pinned image is
# the canonical artifact used to generate the paper's results.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # push to GHCR
  id-token: write      # keyless cosign signing (OIDC)

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally first (do NOT push yet) so we can validate it.
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: arcus-x:ci

      # The image is only published if this passes.
      - name: Run validation suite inside the built image
        run: docker run --rm arcus-x:ci python tests/test_arcus_hardening.py

      - name: Push image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record image digest
        run: echo "Published ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"

      # SBOM (good-engineering signal; not required for most ML papers).
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: spdx-json
          output-file: arcus-x-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcus-x-sbom
          path: arcus-x-sbom.spdx.json

      # Keyless signature (good-engineering signal).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the published image
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
